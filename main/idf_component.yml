dependencies:
  # Shared infrastructure — mianesp repo (same pattern as ws-voice / atomecho /
  # ldr3 / doorbell3). Fetched over HTTPS from the PUBLIC
  # https://github.com/mianos/mianesp — deliberately not the git@github.com: form,
  # which needs an SSH key on the build host and so made a clean clone of this repo
  # fail at dependency resolution, before compiling a single line.
  # Settings stays app-local (main/Settings.h).
  #
  # `version: main` is unpinned, so dependencies.lock IS committed (see
  # .gitignore) to keep builds reproducible. `idf.py update-dependencies` moves
  # forward deliberately.
  #
  # Deliberately NOT depended on: httpclient (cannot do HTTPS — no crt_bundle_attach in its
  # esp_http_client_config_t, so WeatherClient calls esp_http_client directly),
  # otawrapper (the small /firmware handler is enough), audioplayer, button
  # (its ctor calls gpio_pullup_en, which cannot work on input-only GPIO34).
  jsonwrapper:
    git: https://github.com/mianos/mianesp.git
    path: components/jsonwrapper
    version: main
  nvsstoragemanager:
    git: https://github.com/mianos/mianesp.git
    path: components/nvsstoragemanager
    version: main
  wifimanager:
    git: https://github.com/mianos/mianesp.git
    path: components/wifimanager
    version: main
  webserver:
    git: https://github.com/mianos/mianesp.git
    path: components/webserver
    version: main
  settingsbase:
    git: https://github.com/mianos/mianesp.git
    path: components/settingsbase
    version: main
  mqttwrapper:
    git: https://github.com/mianos/mianesp.git
    path: components/mqttwrapper
    version: main
  espressif/mqtt: "*"
